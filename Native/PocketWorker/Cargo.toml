[package]
name = "salient-pocket-worker"
version = "4.0.1"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# Exact inference engine used by Kyutai Pocket TTS v4.0.1. No HF, HTTP, audio I/O,
# Python, or server features: Salient owns downloads and playback.
ptts = { git = "https://github.com/gabrieldemarmiesse/xn-ptts", rev = "7efa26973f81bba42cf2ace8da2c1eb9b605d54d", default-features = false, features = ["accelerate"] }
xn = "=0.2.11"
anyhow = "1"
base64 = "0.22"
half = "2"
log = "0.4"
rand = { version = "0.9", default-features = false, features = ["std", "std_rng"] }
rand_distr = "0.5"
safetensors = "0.7"
sentencepiece = { version = "0.14", features = ["static"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
